# Hugo configuration file
baseURL: "/"
title: "Northflank Infosite"

enableRobotsTXT: true
enableGitInfo: true

outputs:
  home: [html, llms]
  page: [html, markdown]
  section: [html, rss, markdown]

defaultContentLanguage: en
languages:
  en:
    label: English
    locale: en
    weight: 1
    title: Northflank Infosite
    params:
      banner:
        key: starter-template
        message: |
          Northflank deployment notes, screenshots, and practical walkthroughs.

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
        enable: true
  highlight:
    noClasses: false

enableInlineShortcodes: true

menu:
  main:
    - identifier: platform-overview
      name: Platform
      pageRef: /platform-overview
      weight: 1
    - identifier: team-and-project-setup
      name: Setup
      pageRef: /team-and-project-setup
      weight: 2
    - identifier: deploy-container-service
      name: Deploy
      pageRef: /deploy-container-service
      weight: 3
    - identifier: operate-and-observe
      name: Operate
      pageRef: /operate-and-observe
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub
      weight: 6
      url: "https://github.com/your-name/your-repo"
      params:
        icon: github

params:
  description: A Northflank-focused infosite with deployment walkthroughs, platform notes, and screenshot-backed guides.
  externalLinkDecoration: true

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
    width: wide

  theme:
    default: system
    displayToggle: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
    width: normal

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
  displayUpdatedAuthor: false

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  editURL:
    enable: false

  blog:
    list:
      displayTags: true
      sortBy: date
      sortOrder: desc
      pagerSize: 20
    article:
      displayPagination: true

  toc:
    displayTags: true

  highlight:
    copy:
      enable: true
      display: hover

  page:
    width: normal
    contextMenu:
      enable: false

  imageZoom:
    enable: true

  comments:
    enable: false
    type: giscus
